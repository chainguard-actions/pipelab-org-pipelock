name: Test exclude-paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/pl-alt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean project to scan
        run: |
          mkdir -p /tmp/pl-alt "$GITHUB_WORKSPACE/pl-clean-project/vendor"
          printf '# Clean project\n' > "$GITHUB_WORKSPACE/pl-clean-project/README.md"
          printf 'print("hello")\n' > "$GITHUB_WORKSPACE/pl-clean-project/main.py"
          printf 'package vendor\n' > "$GITHUB_WORKSPACE/pl-clean-project/vendor/lib.go"
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '3.8.0'
          directory: pl-clean-project
          fail-on-findings: 'false'
          test-vectors: 'false'
          exclude-paths: |
            vendor/
              *.generated.go

            node_modules/
      - name: Assert audit ran with excludes
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME audit_failed=$AUDIT_FAILED findings=$FINDINGS"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$AUDIT_FAILED" != "false" ]; then
            echo "FAIL: audit failed with exclude-paths"; exit 1
          fi
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count not numeric"; exit 1
          fi
          echo "PASS"
