name: Test exclude-paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean fixture project
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/pl-clean-project"
          mkdir -p "$D/vendor"
          printf '# Clean project\n\nNothing sensitive here.\n' > "$D/README.md"
          printf 'def add(a, b):\n    return a + b\n' > "$D/app.py"
          printf 'def helper():\n    return 1\n' > "$D/vendor/lib.py"
          printf 'package x\n' > "$D/types.generated.go"
      # Upload-artifact inside the action fails under act's artifact server; outcome
      # may be failure for that reason only. Outputs are validated strictly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'v2.6.0'
          directory: pl-clean-project
          fail-on-findings: 'false'
          test-vectors: 'false'
          exclude-paths: |
            vendor/
              *.generated.go

      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome=$OUTCOME score=$SCORE findings=$FINDINGS config=$CONFIG_PATH audit_failed=$AUDIT_FAILED"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then echo "FAIL: unexpected outcome"; exit 1; fi
          if [ "$AUDIT_FAILED" != "false" ]; then echo "FAIL: audit-failed should be false (exclude args / v-prefix handling broken?)"; exit 1; fi
          if ! [[ "$SCORE" =~ ^[0-9]+$ ]]; then echo "FAIL: bad score"; exit 1; fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then echo "FAIL: bad findings count"; exit 1; fi
          if [ -z "$CONFIG_PATH" ]; then echo "FAIL: config-path empty"; exit 1; fi
          if [ ! -f "$CONFIG_PATH" ]; then echo "FAIL: config not found"; exit 1; fi
          echo "PASS"
