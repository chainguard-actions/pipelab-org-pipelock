name: Test exclude-paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean project to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipelock-clean-project/vendor"
          printf '# Clean project\n' > "$GITHUB_WORKSPACE/pipelock-clean-project/README.md"
          printf 'package vendor\n' > "$GITHUB_WORKSPACE/pipelock-clean-project/vendor/lib.go"
      # Internal upload-artifact step fails under act's artifact server;
      # outputs are still set and asserted strictly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: pipelock-clean-project
          fail-on-findings: 'false'
          test-vectors: 'false'
          exclude-paths: |
            vendor/
              *.generated.go
      - name: Assert audit ran with excludes
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "outcome=$OUTCOME audit_failed=$AUDIT_FAILED findings=$FINDINGS score=$SCORE"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$AUDIT_FAILED" != "false" ]; then
            echo "FAIL: audit-failed should be 'false'"; exit 1
          fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]] || ! [[ "$SCORE" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric outputs"; exit 1
          fi
          echo "PASS"
