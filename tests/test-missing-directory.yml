name: Test missing directory fails closed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '2.2.0'
          directory: does-not-exist-dir
          fail-on-findings: 'true'
          test-vectors: 'false'
      - name: Assert fail-closed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME audit_failed=$AUDIT_FAILED score=$SCORE findings=$FINDINGS"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure outcome"; exit 1; fi
          if [ "$AUDIT_FAILED" != "true" ]; then echo "FAIL: expected audit-failed=true"; exit 1; fi
          if [ "$SCORE" != "0" ] || [ "$FINDINGS" != "0" ]; then echo "FAIL: expected zeroed outputs"; exit 1; fi
          echo "PASS"
