name: Test basic audit with auto-generated config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Redirect the action's report dir away from ${{ runner.temp }}/pipelock-reports
      # so the built-in upload-artifact step finds no files (if-no-files-found: ignore);
      # act's artifact server rejects upload-artifact v7 requests.
      RUNNER_TEMP: /tmp/pl-alt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean project to scan
        run: |
          mkdir -p /tmp/pl-alt "$GITHUB_WORKSPACE/pl-clean-project"
          printf '# Clean project\n' > "$GITHUB_WORKSPACE/pl-clean-project/README.md"
          printf 'print("hello")\n' > "$GITHUB_WORKSPACE/pl-clean-project/main.py"
      - id: action
        uses: .
        # The upload-artifact step may fail under act (unsupported artifact server);
        # outputs are validated strictly below regardless.
        continue-on-error: true
        with:
          version: '3.8.0'
          directory: pl-clean-project
          fail-on-findings: 'false'
          test-vectors: 'false'
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome=$OUTCOME score=$SCORE findings=$FINDINGS criticals=$CRITICALS config=$CONFIG_PATH audit_failed=$AUDIT_FAILED"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$AUDIT_FAILED" != "false" ]; then
            echo "FAIL: audit-failed expected 'false'"; exit 1
          fi
          for v in "$SCORE" "$FINDINGS" "$CRITICALS"; do
            if ! echo "$v" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected numeric output, got '$v'"; exit 1
            fi
          done
          if [ "$SCORE" -gt 100 ]; then
            echo "FAIL: score out of range"; exit 1
          fi
          if [ -z "$CONFIG_PATH" ] || [ ! -f "$CONFIG_PATH" ]; then
            echo "FAIL: config-path missing or not a file"; exit 1
          fi
          case "$CONFIG_PATH" in
            */pipelock-reports/suggested.yaml) ;;
            *) echo "FAIL: unexpected auto-generated config path"; exit 1 ;;
          esac
          if ! command -v pipelock >/dev/null; then
            echo "FAIL: pipelock not on PATH"; exit 1
          fi
          pipelock version
          echo "PASS"
