name: Test basic audit of a clean directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean fixture directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipelock-test-clean"
          printf '# Clean fixture\n\nNothing sensitive here.\n' > "$GITHUB_WORKSPACE/pipelock-test-clean/README.md"
      # The action's built-in "Upload audit report" step (if: always()) fails under
      # act's artifact server ("unknown field mime_type"), so the composite step is
      # reported as failed even when the audit works. Outputs are still set and are
      # asserted strictly below.
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: pipelock-test-clean
          test-vectors: 'false'
          fail-on-findings: 'false'
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome=$OUTCOME score=$SCORE findings=$FINDINGS critical=$CRITICAL config=$CONFIG_PATH audit_failed=$AUDIT_FAILED"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$AUDIT_FAILED" != "false" ]; then
            echo "FAIL: audit-failed should be 'false'"; exit 1
          fi
          for v in "$SCORE" "$FINDINGS" "$CRITICAL"; do
            if ! echo "$v" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected numeric output, got '$v'"; exit 1
            fi
          done
          if [ "$SCORE" -gt 100 ]; then
            echo "FAIL: score out of range"; exit 1
          fi
          if [ "$CRITICAL" -gt "$FINDINGS" ]; then
            echo "FAIL: critical count exceeds findings count"; exit 1
          fi
          if [ -z "$CONFIG_PATH" ] || [ ! -f "$CONFIG_PATH" ]; then
            echo "FAIL: auto-generated config not found at '$CONFIG_PATH'"; exit 1
          fi
          case "$CONFIG_PATH" in
            */pipelock-reports/suggested.yaml) ;;
            *) echo "FAIL: unexpected config path"; exit 1 ;;
          esac
          if ! command -v pipelock >/dev/null; then
            echo "FAIL: pipelock binary not on PATH"; exit 1
          fi
          pipelock version
          echo "PASS"
