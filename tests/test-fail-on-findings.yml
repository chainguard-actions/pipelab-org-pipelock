name: Test fail-on-findings gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean project fixture
        run: |
          mkdir -p pipelock-clean-fixture
          printf '# Clean project\n\nNothing sensitive here.\n' > pipelock-clean-fixture/README.md
          printf 'def add(a, b):\n    return a + b\n' > pipelock-clean-fixture/main.py
      - id: action
        uses: .
        continue-on-error: true
        env:
          RUNNER_TEMP: /tmp/pipelock-alt
        with:
          version: '2.8.0'
          directory: pipelock-clean-fixture
          fail-on-findings: 'true'
          test-vectors: 'false'
      - name: Assert gate outcome matches critical count
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome=$OUTCOME critical=$CRITICAL audit_failed=$AUDIT_FAILED"
          if [ "$AUDIT_FAILED" != "false" ]; then echo "FAIL: audit-failed should be false"; exit 1; fi
          if ! [[ "$CRITICAL" =~ ^[0-9]+$ ]]; then echo "FAIL: critical-count not integer"; exit 1; fi
          if [ "$CRITICAL" -gt 0 ]; then
            if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure with criticals"; exit 1; fi
          else
            if [ "$OUTCOME" != "success" ]; then echo "FAIL: expected success with no criticals"; exit 1; fi
          fi
          echo "PASS"
