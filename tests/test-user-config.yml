name: Test user-provided config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean project to scan
        run: |
          mkdir -p /tmp/pl-clean-project /tmp/pl-alt-temp
          printf '# Clean project\n\nNothing sensitive here.\n' > /tmp/pl-clean-project/README.md
          printf 'def add(a, b):\n    return a + b\n' > /tmp/pl-clean-project/main.py
      - id: first
        name: Generate a config with a first run
        uses: .
        env:
          # act's artifact server rejects upload-artifact v7 requests; keep reports
          # out of runner.temp so the upload step finds no files and is ignored.
          RUNNER_TEMP: /tmp/pl-alt-temp
        with:
          directory: /tmp/pl-clean-project
          fail-on-findings: 'false'
          test-vectors: 'false'
      - name: Save generated config
        env:
          GEN: ${{ steps.first.outputs.config-path }}
        run: |
          echo "generated: $GEN"
          if [ ! -f "$GEN" ]; then echo "FAIL: no generated config"; exit 1; fi
          mkdir -p /tmp/pl-user-cfg
          cp "$GEN" /tmp/pl-user-cfg/pipelock.yaml
          echo "USER_CFG=/tmp/pl-user-cfg/pipelock.yaml" >> "$GITHUB_ENV"
      - id: action
        uses: .
        env:
          RUNNER_TEMP: /tmp/pl-alt-temp
        with:
          directory: /tmp/pl-clean-project
          config: ${{ env.USER_CFG }}
          fail-on-findings: 'false'
          test-vectors: 'false'
      - name: Assert config-path echoes user config
        env:
          ACTUAL: ${{ steps.action.outputs.config-path }}
        run: |
          echo "actual: $ACTUAL expected: $USER_CFG"
          if [ "$ACTUAL" != "$USER_CFG" ]; then echo "FAIL: config-path mismatch"; exit 1; fi
          echo "PASS"
