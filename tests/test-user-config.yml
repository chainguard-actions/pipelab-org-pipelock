name: Test user-provided config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean project to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipelock-clean-project"
          printf '# Clean project\n' > "$GITHUB_WORKSPACE/pipelock-clean-project/README.md"
      # Internal upload-artifact step fails under act's artifact server;
      # outputs are still set and asserted strictly.
      - id: generate
        uses: .
        continue-on-error: true
        with:
          directory: pipelock-clean-project
          fail-on-findings: 'false'
          test-vectors: 'false'
      - name: Copy generated config to a stable location
        env:
          GEN: ${{ steps.generate.outputs.config-path }}
        run: |
          echo "generated: $GEN"
          if [ -z "$GEN" ] || [ ! -f "$GEN" ]; then
            echo "FAIL: no generated config"; exit 1
          fi
          cp "$GEN" "$RUNNER_TEMP/user-pipelock.yaml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          config: ${{ runner.temp }}/user-pipelock.yaml
          directory: pipelock-clean-project
          fail-on-findings: 'false'
          test-vectors: 'false'
      - name: Assert config-path echoes user config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.config-path }}
          EXPECTED: ${{ runner.temp }}/user-pipelock.yaml
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED'"; exit 1
          fi
          if [ "$AUDIT_FAILED" != "false" ]; then
            echo "FAIL: audit-failed should be 'false'"; exit 1
          fi
          if ! pipelock check --config "$EXPECTED"; then
            echo "FAIL: user config does not validate"; exit 1
          fi
          echo "PASS"
