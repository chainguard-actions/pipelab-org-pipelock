name: Test fail-closed on nonexistent directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/does-not-exist
          fail-on-findings: 'true'
          test-vectors: 'false'
      - name: Assert action failed closed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome=$OUTCOME audit_failed=$AUDIT_FAILED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for a nonexistent directory"; exit 1
          fi
          echo "PASS"
