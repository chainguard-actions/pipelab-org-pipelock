name: Test fail-on-findings gate is consistent with critical-count
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project to scan
        run: |
          mkdir -p /tmp/pl-gate-project /tmp/pl-gate-temp
          printf '# Clean project\n\nNothing sensitive here.\n' > /tmp/pl-gate-project/README.md
          printf 'def add(a, b):\n    return a + b\n' > /tmp/pl-gate-project/main.py
      - id: action
        uses: .
        continue-on-error: true
        env:
          # act's artifact server rejects upload-artifact v7 requests; keep reports
          # out of runner.temp so the upload step finds no files and is ignored.
          RUNNER_TEMP: /tmp/pl-gate-temp
        with:
          directory: /tmp/pl-gate-project
          # The auto-generated config leaves MCP input/tool scanning disabled, so
          # `pipelock test --fail-on-gap` always fails; isolate the findings gate.
          test-vectors: 'false'
          fail-on-findings: 'true'
      - name: Assert gate outcome matches critical-count
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
        run: |
          echo "outcome=$OUTCOME critical=$CRITICAL findings=$FINDINGS audit_failed=$AUDIT_FAILED config=$CONFIG_PATH"
          if [ "$AUDIT_FAILED" != "false" ]; then echo "FAIL: audit itself failed"; exit 1; fi
          if ! [[ "$CRITICAL" =~ ^[0-9]+$ ]]; then echo "FAIL: critical-count not numeric"; exit 1; fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then echo "FAIL: findings-count not numeric"; exit 1; fi
          if [ "$CRITICAL" -gt "$FINDINGS" ]; then echo "FAIL: critical > findings"; exit 1; fi
          if [ ! -f "$CONFIG_PATH" ]; then echo "FAIL: generated config missing"; exit 1; fi
          if [ "$CRITICAL" -gt 0 ]; then
            if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected gate to fail with $CRITICAL critical findings"; exit 1; fi
          else
            if [ "$OUTCOME" != "success" ]; then echo "FAIL: expected success with 0 critical findings"; exit 1; fi
          fi
          echo "PASS"
